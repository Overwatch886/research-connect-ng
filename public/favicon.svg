<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Nigerian Emerald to Deep Indigo -->
    <linearGradient id="rc-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d5246" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- AI Sparkle Gold Gradient -->
    <linearGradient id="rc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <linearGradient id="rc-stroke" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#rc-bg)" stroke="url(#rc-stroke)" stroke-width="12" />

  <!-- Research Document / Academic Shield Layer -->
  <g transform="translate(106, 96)">
    <!-- Document Body -->
    <path d="M40 0 H200 L260 60 V260 C260 277.67 245.67 292 228 292 H40 C22.33 292 8 277.67 8 260 V32 C8 14.33 22.33 0 40 0 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" />
    <!-- Folded Corner -->
    <path d="M200 0 V60 H260 Z" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" />

    <!-- Connected Research Survey Nodes (Connecting Students & Researchers) -->
    <!-- Node lines -->
    <line x1="56" y1="120" x2="140" y2="120" stroke="#34d399" stroke-width="12" stroke-linecap="round" />
    <line x1="140" y1="120" x2="210" y2="160" stroke="#34d399" stroke-width="12" stroke-linecap="round" />
    <line x1="56" y1="180" x2="130" y2="180" stroke="#818cf8" stroke-width="12" stroke-linecap="round" />
    <line x1="56" y1="230" x2="180" y2="230" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Node circles -->
    <circle cx="56" cy="120" r="14" fill="#34d399" />
    <circle cx="140" cy="120" r="16" fill="#60a5fa" />
    <circle cx="210" cy="160" r="14" fill="#a78bfa" />
    <circle cx="130" cy="180" r="12" fill="#34d399" />
  </g>

  <!-- Google Gemini AI 4-Pointed Star (Empirical Synthesis) -->
  <path d="M370 70 C370 105 340 135 305 135 C340 135 370 165 370 200 C370 165 400 135 435 135 C400 135 370 105 370 70 Z" fill="url(#rc-gold)" />
  <circle cx="370" cy="135" r="8" fill="#ffffff" />

  <!-- Small secondary AI sparkle -->
  <path d="M425 210 C425 225 412 238 397 238 C412 238 425 251 425 266 C425 251 438 238 453 238 C438 238 425 225 425 210 Z" fill="url(#rc-gold)" opacity="0.85" />
</svg>
